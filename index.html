
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Concierge AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 600px;
            max-width: 90%;
            margin: 40px auto;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        #chat-box {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 12px;
            margin-bottom: 15px;
        }

        .message {
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            white-space: pre-wrap;
        }

        .user {
            background: #d9fdd3;
            text-align: right;
        }

        .bot {
            background: #eeeeee;
            text-align: left;
        }

        .input-area {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 12px 20px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:disabled {
            background: gray;
            cursor: not-allowed;
        }

        #status {
            font-size: 12px;
            color: gray;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🍽️ Restaurant Concierge AI</h2>

    <div id="status">Connecting...</div>

    <div id="chat-box">
        <div class="message bot">
            Welcome! How can I assist you today?
        </div>
    </div>

    <div class="input-area">
        <input
            type="text"
            id="user-input"
            placeholder="Ask about our restaurant..."
        >

        <button id="send-btn" onclick="sendMessage()">
            Send
        </button>
    </div>

</div>

<script>
    let socket;
    let currentBotMessage = null;
    let isWaiting = false;

    const chatBox = document.getElementById("chat-box");
    const input = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const statusText = document.getElementById("status");

    function connectWebSocket() {
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";

        socket = new WebSocket(
            `${protocol}//127.0.0.1:8000/ws/chat?provider=openai`
        );

        socket.onopen = function() {
            statusText.textContent = "Connected to Restaurant AI";
            statusText.style.color = "green";
        };

        socket.onmessage = function(event) {
            const data = event.data;

            if (data === "[DONE]") {
                currentBotMessage = null;
                isWaiting = false;
                sendBtn.disabled = false;
                return;
            }

            if (!currentBotMessage) {
                currentBotMessage = document.createElement("div");
                currentBotMessage.className = "message bot";
                chatBox.appendChild(currentBotMessage);
            }

            currentBotMessage.textContent += data;

            chatBox.scrollTop = chatBox.scrollHeight;
        };

        socket.onclose = function() {
            statusText.textContent = "Disconnected. Refresh to reconnect.";
            statusText.style.color = "red";
        };

        socket.onerror = function() {
            statusText.textContent = "WebSocket connection error";
            statusText.style.color = "red";
        };
    }

    function sendMessage() {
        const message = input.value.trim();

        if (!message || !socket || socket.readyState !== WebSocket.OPEN || isWaiting) {
            return;
        }

        const userMessage = document.createElement("div");
        userMessage.className = "message user";
        userMessage.textContent = message;

        chatBox.appendChild(userMessage);

        socket.send(message);

        input.value = "";
        isWaiting = true;
        sendBtn.disabled = true;

        chatBox.scrollTop = chatBox.scrollHeight;
    }

    input.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    });

    connectWebSocket();
</script>

</body>
</html>
